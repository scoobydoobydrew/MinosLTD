<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <title>Elevator Solver CAD</title>
    <link rel="stylesheet" href="style.css?v=1.1">
</head>
<body>
    <div class="container"> <!-- oi klaseis pou edwsa sto css-->
        <h1>Σχεδιασμός Ανελκυστήρα</h1>
        
        <div class="main-layout">
            <section class="inputs">
                <h3>Δεδομένα Φρεατίου</h3>
                <label>Τύπος Ανελκυστήρα:</label>
                <input type="text" value="Υδραυλικός" readonly class="locked-input">
                
                <label>Πλάτος Φρεατίου (mm):</label>
                <input type="number" id="shaftWidth" placeholder="π.χ. 1600">

                <label>Βάθος Φρεατίου (mm):</label> <!-- gia asfaleia <label for="shaftWidth">Πλάτος Φρεατίου (mm):</label> -->
                <input type="number" id="shaftDepth" placeholder="π.χ. 1800">

                <label>Αριθμός Ατόμων:</label>
                <select id="atomaCount">
                    <option value="">-- Χωρίς περιορισμό --</option>
                    <option value="2">2 Άτομα (150 kg)</option>
                    <option value="3">3 Άτομα (225 kg)</option>
                    <option value="4">4 Άτομα (300 kg)</option>
                    <option value="5">5 Άτομα (375 kg)</option>
                    <option value="6">6 Άτομα (450 kg)</option>
                    <option value="7">7 Άτομα (525 kg)</option>
                    <option value="8">8 Άτομα (600 kg)</option>
                    <option value="9">9 Άτομα (675 kg)</option>
                    <option value="10">10 Άτομα (750 kg)</option>
                    <option value="11">11 Άτομα (825 kg)</option>
                    <option value="12">12 Άτομα (900 kg)</option>
                    <option value="13">13 Άτομα (975 kg)</option>
                    <option value="14">14 Άτομα (1050 kg)</option>
                </select>

                <label>Τύπος Πόρτας:</label>
                <select id="doortype">
                    <option value="automatic">Αυτόματη</option>
                    <option value="semi_automatic">Ημιαυτόματη</option>
                </select>

                <label>Αριθμός Φύλλων Πόρτας:</label>
                <select id="doorLeaves" onchange="updateDoorLogic()">
                    <option value="2">2 Φύλλα</option>
                    <option value="3">3 Φύλλα</option>
                    <option value="4">4 Φύλλα</option>
                </select>


                <label>Θέση Σασί / Εμβόλου:</label>
                <select id="thesi_sassi">
                <option value="right">Δεξιά</option>
                <option value="side">Αριστερά</option>
                <option value="rear">Πίσω</option>
                </select>

                

                <label>Άνοιγμα Πόρτας (mm)</label>
                <select id="doorOpening">
                    </select>

                <label>Τύπος Ανοίγματος:</label>
                <select id="tuposAnoigmatos">
                </select>

                <label>Κατεύθυνση Ανοίγματος:</label>
                <select id="kateuthinsiAnoigmatos">
                <option value="Αριστερά">Αριστερά</option>
                <option value="Δεξιά">Δεξιά</option>
                </select>

                <label>Είσοδοι Καμπίνας:</label>
                <select id="cabinDoors">
                <option value="1">1 Πόρτα</option>
                <option value="2_opposite">2 Πόρτες (διαμπερές)</option>
                <option value="2_gwniako">2 Πόρτες (γωνιακό)</option>
                </select>
                
                <div id="secondDoorPosContainer" style="display: none; margin-top: 10px;">
                    <label>Πλευρά 2ης πόρτας:</label>
                    <select id="secondDoorPosition">
                        <option value="left">Αριστερά</option>
                        <option value="right">Δεξιά</option>
                    </select>

                    <label>Άνοιγμα 2ης πόρτας προς:</label>
                    <select id="secondDoorDir">
                        <option value="panw">Προς Πάνω</option>
                        <option value="katw">Προς Κάτω</option>
                    </select>
                </div>

                <label>Βάθος Πυθμένα Φρεατίου (mm):</label>
                <input type="number" id="vathos_puthmena" placeholder="300">

                <label>Ύψος Τελευταίου Ορόφου (mm):</label>
                <input type ="number" id="ipsos_tel_orofou" placeholder="2100">

                <label>Διαδρομή Ανελκυστήρα (mm):</label>
                <input type="number" id="diadromi_anelkistira" placeholder="1000">
              

                <button onclick="solveElevator()">Υπολογισμός & Συναρμολόγηση</button>
            </section>

           <section class="drawing-area">
                <div id="elevator-plan-container" style="width: 100%; min-height: 600px; background: #000; border-radius: 25px; display: flex; justify-content: center; align-items: center; overflow: hidden; border: 2px solid var(--border-color); margin-bottom: 20px;">
                    <p style="color: #64748b;">Η κάτοψη θα εμφανιστεί εδώ μετά τον υπολογισμό</p>
                </div>

                <div id="side-view-container" style="width: 100%; min-height: 800px; background: #000; border-radius: 25px; display: flex; justify-content: center; align-items: center; overflow: hidden; border: 2px solid var(--border-color); margin-bottom: 20px; display: none;">
                    <p id="side-view-placeholder" style="color: #64748b;">Η πλάγια όψη θα εμφανιστεί εδώ</p>
                    <svg id="elevator-svg-side" width="100%" height="100%"></svg>
                </div>

                <div id="resultsTable"></div>
            </section>
        </div>
    </div>

    <script src="app.js"></script>
    <script src="sideView.js"></script> </body>
</html>
