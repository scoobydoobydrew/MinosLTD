<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <title>Elevator Solver CAD</title>
    <link rel="stylesheet" href="style.css?v=1.1">
</head>
<body>
    <div class="container">
        <h1>Σχεδιασμός Ανελκυστήρα</h1>
        
        <div class="main-layout">
            <section class="inputs">
                <h3>Δεδομένα Φρεατίου</h3>
                <label>Τύπος Ανελκυστήρα:</label>
                <input type="text" value="Υδραυλικός" readonly class="locked-input">
                
                <label>Πλάτος Φρεατίου (mm):</label>
                <input type="number" id="shaftWidth" placeholder="π.χ. 1600">

                <label>Βάθος Φρεατίου (mm):</label>
                <input type="number" id="shaftDepth" placeholder="π.χ. 1800">

                <label>Απόβαρο P (kg):</label>
                <input type="number" id="pWeight" placeholder="π.χ. 450">

                <label>Ωφέλιμο Φορτίο Q (kg):</label>
                <input type="number" id="qLoad" placeholder="π.χ. 630">

                <label>Τύπος Πόρτας:</label>
                <select id="doortype">
                    <option value="automatic">Αυτόματη</option>
                    <option value="semi_automatic">Ημιαυτόματη</option>
                </select>

                <label>Αριθμός Φύλλων Πόρτας:</label>
                <select id="doorLeaves">
                    <option value="2">2 Φύλλα</option>
                    <option value="4">4 Φύλλα</option>
                </select>


                <label>Θέση Σασί / Εμβόλου:</label>
                <select id="thesi_sassi">
                <option value="side">Δεξιά</option>
                <option value="side">Αριστερά</option>
                <option value="rear">Πίσω</option>
                </select>

                

                <label>Άνοιγμα Πόρτας (mm)</label>
                <select id="doorOpening">
                    <option value="550">550 mm</option>
                    <option value="600">600 mm</option>
                    <option value="650">650 mm</option>
                    <option value="700">700 mm</option>
                    <option value="750">750 mm</option>
                    <option value="800">800 mm</option>
                    <option value="850">850 mm</option>
                    <option value="900">900 mm</option>
                    <option value="950">950 mm</option>
                    <option value="1000">1000 mm</option>
                    <option value="1100">1100 mm</option>
                    <option value="1200">1200 mm</option>
                    <option value="1300">1300 mm</option>
                    <option value="1400">1400 mm</option>
                    <option value="1500">1500 mm</option>
                    <option value="1600">1600 mm</option>
                </select>

              

                <button onclick="solveElevator()">Υπολογισμός & Συναρμολόγηση</button>
            </section>

            <section class="drawing-area">
                <canvas id="elevatorCanvas" width="600" height="600"></canvas>
                <div id="resultsTable">
                    </div>
            </section>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
